<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Workplace Task Manager - Login</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header>
    <div class="left">
      <div class="badge blue">Company</div>
      <b>Workplace Task Manager</b>
    </div>
    <div class="badge">Secure Access</div>
  </header>

  <main>
    <div class="card">
      <h2>Login</h2>
      <p><small>Use your Employee ID and password provided by the admin.</small></p>

      <div class="grid2">
        <div>
          <label>Employee ID</label>
          <input id="employeeId" placeholder="EMP101" autocomplete="username" />
        </div>
        <div>
          <label>Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
        <button id="btnLogin">Login</button>
        <span id="msg"></span>
      </div>

      <hr/>
      <small>Tip: for demo, run server seed and use ADM001 / Admin@123.</small>
    </div>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
